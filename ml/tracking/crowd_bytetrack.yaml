# SafeCrowd Dense Surveillance ByteTrack Configuration
# Optimized for high-density crowds, deep occlusions, and distant pedestrian bodies
tracker_type: bytetrack
track_high_thresh: 0.20 # Associate stage-1 detections even under partial occlusion
track_low_thresh: 0.08  # Associate stage-2 weak detections during heavy overlaps
new_track_thresh: 0.22  # Allow tracks to initialize on dense pack members
track_buffer: 60        # Retain lost tracks for 60 frames (~2.4 seconds)
match_thresh: 0.70      # Association IoU cost threshold
fuse_score: True
