version: '3.8'

services:
  # Database Service - PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: surge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: surge
      POSTGRES_PASSWORD: surge_secure_password
      POSTGRES_DB: surge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surge -d surge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Queue & Cache Service - Redis 7
  redis:
    image: redis:7-alpine
    container_name: surge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Computer Vision & Real-time Analytics API Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: surge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://surge:surge_secure_password@postgres:5432/surge
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - ./frontend/public:/app/frontend/public:ro
      - ./backend/snapshots:/app/backend/snapshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Dashboard Web Client (Nginx Reverse Proxy + React)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: surge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
